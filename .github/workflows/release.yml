name: Release

# Cuts cross-platform binaries + sha256sums for every release. Two triggers:
#
#   - push to main → auto-release with CalVer "vYYYY.MM.DD-<short-sha>".
#     Mirrors simple-container-com/api's own release cadence (every merge
#     to main cuts a new sc release).
#   - manually-pushed "v*" tag → named release for pinning / rollback.
#
# Both paths produce two sets of artifacts: three sc-plugin-aws binaries
# (linux/amd64, linux/arm64, darwin/arm64) + the cloud-helpers Lambda
# binary (linux/amd64 only — Lambda's amd64 x86_64 architecture) + a
# sha256sums.txt and a GitHub Release.
#
# Why the OOM pins (GOMAXPROCS=1, GOMEMLIMIT=6GiB, `go build -p 1`): a
# plugin that imports a big cloud SDK OOMs the standard 7 GB GHA runner
# at default parallelism. pulumi-aws is the single biggest SDK of all
# the forge-fleet plugins (~75 MB in the module cache) — these pins
# cost ~2 minutes of wall time on linux/amd64 and prevent a class of
# first-release failure that was learned the hard way on
# sc-plugin-yandex v1 (first release ran out of memory at link time).

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      is_tag:  ${{ steps.compute.outputs.is_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: compute
        name: Resolve version string
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "is_tag=true"               >> "$GITHUB_OUTPUT"
          else
            ver="v$(date -u +%Y.%m.%d)-$(git rev-parse --short=7 HEAD)"
            echo "version=${ver}"            >> "$GITHUB_OUTPUT"
            echo "is_tag=false"              >> "$GITHUB_OUTPUT"
          fi

  build-plugin:
    name: Build plugin ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: version
    strategy:
      matrix:
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: plugin/go.sum

      - name: Build sc-plugin-aws
        working-directory: plugin
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          VERSION: ${{ needs.version.outputs.version }}
          GOMAXPROCS: '1'
          GOMEMLIMIT: '6GiB'
        run: |
          out=sc-plugin-aws-${GOOS}-${GOARCH}
          go build -trimpath -buildvcs=false -p 1 \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o "../${out}" \
            ./cmd/sc-plugin-aws
          sha256sum "../${out}" > "../${out}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            sc-plugin-aws-${{ matrix.goos }}-${{ matrix.goarch }}*

  build-cloud-helpers:
    name: Build cloud-helpers linux-amd64
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: plugin/go.sum

      - name: Build cloud-helpers Lambda binary
        working-directory: plugin
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
          VERSION: ${{ needs.version.outputs.version }}
          GOMAXPROCS: '1'
          GOMEMLIMIT: '6GiB'
        run: |
          out=cloud-helpers-linux-amd64
          go build -trimpath -buildvcs=false -p 1 \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o "../${out}" \
            ./cmd/cloud-helpers
          sha256sum "../${out}" > "../${out}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: cloud-helpers-linux-amd64
          path: |
            cloud-helpers-linux-amd64*

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [version, build-plugin, build-cloud-helpers]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build consolidated sha256sums.txt
        working-directory: dist
        run: |
          cat *.sha256 > sha256sums.txt
          rm *.sha256
          cat sha256sums.txt

      - name: Tag commit if from main
        if: needs.version.outputs.is_tag == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git tag "${VERSION}"
          git push origin "${VERSION}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "${VERSION}" \
            --title "${VERSION}" \
            --generate-notes \
            dist/*

  notify:
    name: Notify Telegram
    runs-on: ubuntu-latest
    # `needs:` lists EVERY earlier job so the success/failure guards below
    # see a complete picture — a missing job's result is absent from
    # `needs.*.result` and the guards silently flip wrong.
    needs: [version, build-plugin, build-cloud-helpers, release]
    # `if: always()` is what makes this run even when an earlier `needs:`
    # job failed, cancelled, or was skipped — without it GitHub skips the
    # whole notify job and no "release failed" notification ever fires.
    if: always()
    steps:
      - name: Notify Telegram (success)
        # Mirrors api/.github/workflows/push.yaml's release-notify guard:
        # success() alone is not enough — a CANCELLED or SKIPPED upstream
        # need silently passes `!contains(..., 'failure')` while this job's
        # own `success()` is true, which would send a "released" claim for
        # a release that produced no artefacts. api hit exactly this on
        # run 39253348066 before the guards expanded to all three outcomes.
        if: ${{ success() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
        continue-on-error: true
        uses: simple-container-com/actions/release-notify@82457e84c1baa68cfdab423a779814949dc376a8 # main @ 2026-11-12
        with:
          plugin-name: sc-plugin-aws
          version: ${{ needs.version.outputs.version }}
          status: success
          chat-id: ${{ secrets.CICD_BOT_TELEGRAM_CHAT_ID }}
          token: ${{ secrets.CICD_BOT_TELEGRAM_TOKEN }}

      - name: Notify Telegram (failure)
        # Mirror of the success guard — a cancelled or skipped need is also
        # a release that did not happen, so it gets the failure notice.
        if: ${{ failure() || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        continue-on-error: true
        uses: simple-container-com/actions/release-notify@82457e84c1baa68cfdab423a779814949dc376a8 # main @ 2026-11-12
        with:
          plugin-name: sc-plugin-aws
          version: ${{ needs.version.outputs.version }}
          status: failure
          chat-id: ${{ secrets.CICD_BOT_TELEGRAM_CHAT_ID }}
          token: ${{ secrets.CICD_BOT_TELEGRAM_TOKEN }}
